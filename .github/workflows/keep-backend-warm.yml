# Keeps the Render free-tier API awake so visitors avoid long cold starts.
name: Keep backend warm

on:
  schedule:
    # Every 10 minutes — Render free tier sleeps after ~15 min idle.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          set -e
          URL="${{ secrets.BACKEND_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            URL="https://music-history-backend-6ojw.onrender.com/api/health"
          fi
          echo "Pinging $URL"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 45 "$URL"; then
              echo
              echo "OK on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed; retrying..."
            sleep 8
          done
          echo "Health check failed after retries"
          exit 1
