services:
  - type: web
    name: history-of-music-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  # If the service Root Directory is empty (repo root), use these instead:
  # buildCommand: npm run build:render
  # startCommand: npm start
  # (legacy) startCommand: node servers/index.js
